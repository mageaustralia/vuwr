# Do the tests actually test anything?
#
# Coverage says a line ran. Mutation testing changes the line and asks
# whether any test noticed — the only automated answer to "is this suite
# load-bearing or decorative". Several bugs this project has shipped were
# in code that was covered and unchecked.
#
# Weekly and on demand, not per push: it compiles the crate once per
# mutation and takes far too long to sit in front of a merge.
name: Mutants

on:
  schedule:
    # Sunday, early UTC.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    # Generous, because the point is to finish rather than to be quick.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - uses: Swatinem/rust-cache@v2

      # vuwr-core only. It holds the parsing, the edit operations and the
      # undo — the parts where a silent wrong answer costs a file. The
      # frontends are checked by drawing them.
      # Exit codes are load-bearing here, so they are read rather than
      # ignored. `continue-on-error` swallowed everything including a
      # usage error, and the job reported success having done nothing —
      # which is worse than no check at all.
      - name: Mutate
        run: |
          set +e
          cargo mutants --package vuwr-core --no-shuffle -j 2
          status=$?
          set -e
          case "$status" in
            # Every mutant caught, or some survived — a finding to read,
            # not a broken build.
            0|2) exit 0 ;;
            *) echo "::error::cargo mutants exited $status"; exit "$status" ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report
          path: mutants.out/
          if-no-files-found: warn
