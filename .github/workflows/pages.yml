# Build the browser bundle and publish it to GitHub Pages.
#
# The page is entirely static — the wasm reads files in the tab and talks
# to nothing — so there is no server side to this deployment.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes an older one rather
# than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # eframe's native side needs the GTK/X11 headers even for a wasm
      # build, because the crate's dependencies are resolved for both.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      # The CLI has to match the crate exactly — wasm-bindgen rejects a
      # mismatch at load time, which is a confusing way to find out. The
      # version comes from the lockfile so it cannot drift.
      - run: |
          version=$(cargo tree -p vuwr-web --target wasm32-unknown-unknown \
            | grep -m1 -o 'wasm-bindgen v[0-9.]*' | cut -d'v' -f2)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: ./web/build.sh
      # Serve web/ itself: index.html loads ./dist/vuwr.js.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
