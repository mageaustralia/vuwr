[package]
name = "vuwr-gui"
description = "eframe/egui frontend for vuwr (native + wasm)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vuwr-core = { path = "../vuwr-core" }
# Default features, deliberately. Turning them off builds, renders and
# responds to the mouse — but keyboard input never reaches the app on the
# web, and nothing reports an error. See web/README.md.
eframe = "0.33"
egui = "0.33"
# Native and web file dialogs. On the web it drives a file input, so
# "Open" means the same thing in both builds.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Runs a file dialog's future on its own thread, so no async runtime is
# needed just to open a file.
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element"] }
