[package]
name = "vuwr-gui"
description = "eframe/egui frontend for vuwr (native + wasm)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vuwr-core = { path = "../vuwr-core" }
# `default-features = false` drops the persistence and accesskit extras we
# do not use; glow is the renderer that works on both native and the web.
eframe = "0.33"
egui = "0.33"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element"] }
