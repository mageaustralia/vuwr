[package]
name = "vuwr-core"
description = "Document model, loaders, edit ops, undo and view state for vuwr. Pure: bytes in, bytes out, no I/O."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Search and filter. Permissive, wasm-clean, and the CI wasm32 check keeps
# it that way.
regex = "1"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
proptest = "1"
