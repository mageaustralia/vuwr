[package]
name = "vuwr-web"
description = "vuwr in the browser: the same core and GUI, compiled to WebAssembly."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vuwr-core = { path = "../vuwr-core" }
vuwr-gui = { path = "../vuwr-gui" }
eframe = "0.33"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location"] }
console_error_panic_hook = "0.1"
