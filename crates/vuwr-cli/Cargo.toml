[package]
name = "vuwr"
description = "A fast, editable viewer for CSV / JSON / XML."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "vuwr"
path = "src/main.rs"

[dependencies]
vuwr-core = { path = "../vuwr-core" }
vuwr-tui = { path = "../vuwr-tui" }
vuwr-gui = { path = "../vuwr-gui" }
clap = { version = "4.6.6", features = ["derive"] }

[target.'cfg(unix)'.dev-dependencies]
# Building a pseudo-terminal for the piped-input test: there is no way to
# ask for one from std, and the bug being tested only appears when the
# other end of stdout is a real terminal.
libc = "0.2"
