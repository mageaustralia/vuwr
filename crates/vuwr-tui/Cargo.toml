[package]
name = "vuwr-tui"
description = "ratatui terminal frontend for vuwr (native only)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# System clipboard for copy/paste. Native only; the TUI does not build
# for wasm.
arboard = "3"
crossterm = "0.29.0"
ratatui = "0.30.2"
# Waiting on the terminal's own file descriptor to answer a question,
# without crossterm's event reader in the way — it buffers what it polls,
# and the bytes we were owed became keystrokes.
libc = "0.2"

vuwr-core = { path = "../vuwr-core" }

[dev-dependencies]
insta = "1.48.0"
