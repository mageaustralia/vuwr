<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>vuwr</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1b; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #loading {
        position: absolute; inset: 0; display: grid; place-content: center;
        color: #999; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="vuwr"></canvas>
    <div id="loading">loading vuwr…</div>
    <script type="module">
      import init, { start } from "./dist/vuwr.js";
      try {
        // The wasm is passed explicitly so a rebuilt bundle is picked up:
        // the browser caches `vuwr_bg.wasm` aggressively otherwise, and a
        // stale one is indistinguishable from a code change that did not
        // take.
        await init({ module_or_path: `./dist/vuwr_bg.wasm?v=${Date.now()}` });
        await start("vuwr");
        document.getElementById("loading").remove();
      } catch (e) {
        document.getElementById("loading").textContent =
          "vuwr failed to start: " + e;
        console.error("vuwr failed to start", e);
      }
    </script>
  </body>
</html>
