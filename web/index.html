<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>vuwr</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #FDFDFE; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #loading {
        position: absolute; inset: 0; display: grid; place-content: center;
        color: #999; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="vuwr"></canvas>
    <div id="loading">loading vuwr…</div>
    <script type="module">
      try {
        // Both halves are stamped with the build's own id, read from a
        // file too small to be worth caching. Only the wasm used to be
        // stamped, so a rebuild could pair a fresh module with a cached
        // `vuwr.js` — which fails as `__wasm_bindgen_func_elem_… is not a
        // function`, a mismatch that reads like a broken build. Stamping
        // both also lets the browser keep them until they actually change.
        const build = (
          await (await fetch("./dist/build.txt", { cache: "no-store" })).text()
        ).trim();
        const { default: init, start } = await import(
          `./dist/vuwr.js?v=${build}`
        );
        await init({ module_or_path: `./dist/vuwr_bg.wasm?v=${build}` });
        await start("vuwr");
        document.getElementById("loading").remove();
      } catch (e) {
        document.getElementById("loading").textContent =
          "vuwr failed to start: " + e;
        console.error("vuwr failed to start", e);
      }
    </script>
  </body>
</html>
