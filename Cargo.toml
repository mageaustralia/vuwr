[workspace]
resolver = "3"
members = [
    "crates/vuwr-core",
    "crates/vuwr-tui",
    "crates/vuwr-gui",
    "crates/vuwr-cli",
    "crates/vuwr-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
strip = true
lto = true

# Release speed with symbols, for `sample` and friends: the release binary
# is stripped, so a profile of it is all `???`.
[profile.profiling]
inherits = "release"
strip = false
debug = 1
